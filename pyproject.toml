[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-debate-arena"
version = "0.1.0"
description = "A tournament engine for AI-vs-AI debate in the Chinese (华辩) format"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
]

[project.optional-dependencies]
# 赛录导出 PDF（md 导出不需要）
pdf = ["reportlab>=4.0"]
# 主持人播报（不配就不播报，比赛照打）
host = ["httpx>=0.27"]
# 评委一致性统计 κ / ICC
stats = ["numpy>=1.24"]
# tools/demo.py 一条命令起服务用：引擎本身只依赖 fastapi，接进自己的 app 不需要 uvicorn
demo = ["uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["arena", "tools"]

[tool.setuptools.package-data]
# 观赛单页（arena/static/viewer.html）：纯 HTML/CSS/JS，打包时要跟着 arena 一起装，
# 不然装完的包里只有 .py、GET /viewer 在别人机器上会 500。
arena = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
